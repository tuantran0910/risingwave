name: Release Docker Image (Simple)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (optional, defaults to latest tag)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/risingwave

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag
        id: meta
        run: |
          # Use input tag or get from push event
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            echo "No tag specified"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            CARGO_PROFILE=production

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          release_name: Release ${{ steps.meta.outputs.tag }}
          body: |
            ## Docker Image Released

            ### Pull the image:
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ```

            ### Run RisingWave:
            ```bash
            docker run -d --name risingwave \
              -p 4566:4566 -p 5691:5691 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
              standalone
            ```

            ## What's New

            This release includes enhanced Iceberg BigLake integration with support for:
            - Google Cloud BigLake Metastore REST catalog
            - Google AuthManager authentication (Iceberg 1.10+)
            - GCS FileIO support
            - BigQuery warehouse paths (`bq://`)
            - Custom Iceberg table properties

            ## Quick Test

            ```sql
            -- Connect to RisingWave
            psql -h localhost -p 4566 -U root -d dev

            -- Test BigLake Iceberg sink
            CREATE SINK test_sink FROM your_table
            WITH (
                connector = 'iceberg',
                catalog.type = 'rest',
                catalog.uri = 'https://biglake.googleapis.com/iceberg/v1/restcatalog',
                warehouse.path = 'bq://projects/your-project',
                catalog.security = 'google',
                catalog.io-impl = 'org.apache.iceberg.gcp.gcs.GCSFileIO',
                database.name = 'your_dataset',
                table.name = 'your_table'
            );
            ```
          draft: false
          prerelease: false

      - name: Success notification
        if: success()
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          echo "🔗 Available at: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
