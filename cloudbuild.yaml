options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/rainbow-data-production-483609/rainbow-docker-repo/risingwave:$TAG_NAME'
      - '-f'
      - 'docker/Dockerfile'
      - '--build-arg'
      - 'CARGO_PROFILE=production'
      - '.'   # ✅ build context (directory)

images:
  - 'gcr.io/rainbow-data-production-483609/rainbow-docker-repo/risingwave:$TAG_NAME'
