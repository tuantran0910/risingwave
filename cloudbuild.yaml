options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: projects/rainbow-data-production-483609/locations/us-west3/workerPools/risingwave-pool

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/rainbow-data-production-483609/rainbow-docker-repo/risingwave:$TAG_NAME'
      - './docker/Dockerfile'
      - '--build-arg'
      - 'CARGO_PROFILE=production'

images:
  - 'gcr.io/rainbow-data-production-483609/rainbow-docker-repo/risingwave:$TAG_NAME'
